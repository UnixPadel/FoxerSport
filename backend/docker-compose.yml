services:
  # ----------------------------------------
  # 1. MEILISEARCH (Moteur de recherche)
  # ----------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: foxer_meilisearch
    environment:
      - MEILI_MASTER_KEY=foxersport-master-key-secure
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  # ----------------------------------------
  # 2. REDIS (Rate Limiting & Cache)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: foxer_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  meili_data:
  redis_data:
